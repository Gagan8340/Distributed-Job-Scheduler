<svg viewBox="0 0 1100 620" xmlns="http://www.w3.org/2000/svg">
<rect width="1100" height="620" fill="#fafafa"/>

<defs>
  <marker id="arrowhead2" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
    <polygon points="0 0, 10 4, 0 8" fill="#4b5563"/>
  </marker>
</defs>

<text x="550.0" y="34" text-anchor="middle" font-family="Segoe UI, Arial" font-size="20" font-weight="700" fill="#111827">Job Lifecycle State Machine</text>
<circle cx="70" cy="130" r="8" fill="#111827"/>

<text x="70" y="112" text-anchor="middle" font-family="Segoe UI, Arial" font-size="10" fill="#374151">start</text>
<rect x="150" y="95" width="170" height="50" rx="25.0" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.8"/>
<text x="235.0" y="125.0" text-anchor="middle" font-family="Segoe UI, Arial" font-size="14" font-weight="700" fill="#1e1b4b">QUEUED</text>

<rect x="150" y="195" width="170" height="50" rx="25.0" fill="#e0e7ff" stroke="#4338ca" stroke-width="1.8"/>
<text x="235.0" y="225.0" text-anchor="middle" font-family="Segoe UI, Arial" font-size="14" font-weight="700" fill="#1e1b4b">SCHEDULED</text>

<rect x="420" y="95" width="170" height="50" rx="25.0" fill="#fef3c7" stroke="#b45309" stroke-width="1.8"/>
<text x="505.0" y="125.0" text-anchor="middle" font-family="Segoe UI, Arial" font-size="14" font-weight="700" fill="#1e1b4b">CLAIMED</text>

<rect x="650" y="95" width="170" height="50" rx="25.0" fill="#fed7aa" stroke="#c2410c" stroke-width="1.8"/>
<text x="735.0" y="125.0" text-anchor="middle" font-family="Segoe UI, Arial" font-size="14" font-weight="700" fill="#1e1b4b">RUNNING</text>

<rect x="900" y="40" width="170" height="50" rx="25.0" fill="#dcfce7" stroke="#15803d" stroke-width="1.8"/>
<text x="985.0" y="70.0" text-anchor="middle" font-family="Segoe UI, Arial" font-size="14" font-weight="700" fill="#1e1b4b">COMPLETED</text>

<rect x="650" y="260" width="170" height="50" rx="25.0" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.8"/>
<text x="735.0" y="290.0" text-anchor="middle" font-family="Segoe UI, Arial" font-size="14" font-weight="700" fill="#1e1b4b">FAILED</text>

<rect x="900" y="350" width="190" height="50" rx="25.0" fill="#1f2937" stroke="#111827" stroke-width="1.8"/>
<text x="995.0" y="380.0" text-anchor="middle" font-family="Segoe UI, Arial" font-size="14" font-weight="700" fill="#ffffff">DEAD_LETTER</text>

<rect x="150" y="480" width="170" height="50" rx="25.0" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.8"/>
<text x="235.0" y="510.0" text-anchor="middle" font-family="Segoe UI, Arial" font-size="14" font-weight="700" fill="#1e1b4b">CANCELLED</text>

<circle cx="1050" cy="65" r="8" fill="#111827"/>

<circle cx="1050" cy="375" r="8" fill="#111827"/>

<line x1="78" y1="130" x2="150" y2="118" stroke="#4b5563" stroke-width="1.7"  marker-end="url(#arrowhead2)"/>
<rect x="65.80000000000001" y="114.0" width="96.39999999999999" height="20" fill="#fafafa" opacity="0.95"/>
<text x="114.0" y="126.0" text-anchor="middle" font-family="Segoe UI, Arial" font-size="11" fill="#374151">immediate job</text>

<path d="M 78 138 Q 90 220 150 210" fill="none" stroke="#4b5563" stroke-width="1.7"  marker-end="url(#arrowhead2)"/>
<rect x="21.400000000000006" y="203.0" width="137.2" height="34" fill="#fafafa" opacity="0.95"/>
<text x="90" y="215.0" text-anchor="middle" font-family="Segoe UI, Arial" font-size="11" fill="#374151">delayed / scheduled</text>
<text x="90" y="229.0" text-anchor="middle" font-family="Segoe UI, Arial" font-size="11" fill="#374151">/ cron job</text>

<line x1="235" y1="195" x2="235" y2="145" stroke="#4b5563" stroke-width="1.7"  marker-end="url(#arrowhead2)"/>
<rect x="183.4" y="160.0" width="103.2" height="20" fill="#fafafa" opacity="0.95"/>
<text x="235.0" y="172.0" text-anchor="middle" font-family="Segoe UI, Arial" font-size="11" fill="#374151">run_at reached</text>

<line x1="320" y1="118" x2="420" y2="110" stroke="#4b5563" stroke-width="1.7"  marker-end="url(#arrowhead2)"/>
<rect x="321.8" y="97.0" width="96.39999999999999" height="34" fill="#fafafa" opacity="0.95"/>
<text x="370.0" y="109.0" text-anchor="middle" font-family="Segoe UI, Arial" font-size="11" fill="#374151">worker claims</text>
<text x="370.0" y="123.0" text-anchor="middle" font-family="Segoe UI, Arial" font-size="11" fill="#374151">(SKIP LOCKED)</text>

<line x1="590" y1="118" x2="650" y2="118" stroke="#4b5563" stroke-width="1.7"  marker-end="url(#arrowhead2)"/>
<rect x="571.8" y="108.0" width="96.39999999999999" height="20" fill="#fafafa" opacity="0.95"/>
<text x="620.0" y="120.0" text-anchor="middle" font-family="Segoe UI, Arial" font-size="11" fill="#374151">markRunning()</text>

<line x1="820" y1="105" x2="900" y2="70" stroke="#4b5563" stroke-width="1.7"  marker-end="url(#arrowhead2)"/>
<rect x="801.6" y="77.5" width="116.8" height="20" fill="#fafafa" opacity="0.95"/>
<text x="860.0" y="89.5" text-anchor="middle" font-family="Segoe UI, Arial" font-size="11" fill="#374151">handler resolves</text>

<path d="M 760 145 Q 800 200 720 260" fill="none" stroke="#4b5563" stroke-width="1.7"  marker-end="url(#arrowhead2)"/>
<rect x="748.4" y="183.0" width="103.2" height="34" fill="#fafafa" opacity="0.95"/>
<text x="800" y="195.0" text-anchor="middle" font-family="Segoe UI, Arial" font-size="11" fill="#374151">handler throws</text>
<text x="800" y="209.0" text-anchor="middle" font-family="Segoe UI, Arial" font-size="11" fill="#374151">/ times out</text>

<path d="M 650 285 Q 470 400 320 235" fill="none" stroke="#4b5563" stroke-width="1.7"  marker-end="url(#arrowhead2)"/>
<rect x="374.2" y="376.0" width="191.6" height="48" fill="#fafafa" opacity="0.95"/>
<text x="470" y="388.0" text-anchor="middle" font-family="Segoe UI, Arial" font-size="11" fill="#374151">retry (attempts below max):</text>
<text x="470" y="402.0" text-anchor="middle" font-family="Segoe UI, Arial" font-size="11" fill="#374151">fixed/linear/exponential</text>
<text x="470" y="416.0" text-anchor="middle" font-family="Segoe UI, Arial" font-size="11" fill="#374151">backoff -> re-queued</text>

<line x1="830" y1="285" x2="900" y2="355" stroke="#4b5563" stroke-width="1.7"  marker-end="url(#arrowhead2)"/>
<rect x="810.0" y="303.0" width="110.0" height="34" fill="#fafafa" opacity="0.95"/>
<text x="865.0" y="315.0" text-anchor="middle" font-family="Segoe UI, Arial" font-size="11" fill="#374151">attempts at max</text>
<text x="865.0" y="329.0" text-anchor="middle" font-family="Segoe UI, Arial" font-size="11" fill="#374151">(exhausted)</text>

<path d="M 900 380 Q 600 480 320 260" fill="none" stroke="#4b5563" stroke-width="1.7"  marker-end="url(#arrowhead2)"/>
<rect x="534.8" y="463.0" width="130.39999999999998" height="34" fill="#fafafa" opacity="0.95"/>
<text x="600" y="475.0" text-anchor="middle" font-family="Segoe UI, Arial" font-size="11" fill="#374151">manual admin retry</text>
<text x="600" y="489.0" text-anchor="middle" font-family="Segoe UI, Arial" font-size="11" fill="#374151">(from DLQ)</text>

<path d="M 78 145 Q 40 340 150 495" fill="none" stroke="#4b5563" stroke-width="1.7"  marker-end="url(#arrowhead2)"/>
<rect x="-28.599999999999994" y="323.0" width="137.2" height="34" fill="#fafafa" opacity="0.95"/>
<text x="40" y="335.0" text-anchor="middle" font-family="Segoe UI, Arial" font-size="11" fill="#374151">cancel()</text>
<text x="40" y="349.0" text-anchor="middle" font-family="Segoe UI, Arial" font-size="11" fill="#374151">(non-terminal only)</text>

<circle cx="1075" cy="65" r="6" fill="none" stroke="#111827" stroke-width="2"/>
<circle cx="1075" cy="375" r="6" fill="none" stroke="#111827" stroke-width="2"/>
<line x1="1070" y1="65" x2="1069" y2="65" stroke="#4b5563" stroke-width="1.7"  marker-end="url(#arrowhead2)"/>

<line x1="1090" y1="375" x2="1069" y2="375" stroke="#4b5563" stroke-width="1.7"  marker-end="url(#arrowhead2)"/>

<rect x="60" y="540" width="980" height="60" rx="8" fill="#ffffff" stroke="#e5e7eb"/>
<text x="80" y="565" font-family="Segoe UI, Arial" font-size="12" fill="#374151">Terminal states: COMPLETED, DEAD_LETTER (unless manually requeued), CANCELLED. All non-terminal states may transition to CANCELLED via explicit user action.</text>
<text x="80" y="585" font-family="Segoe UI, Arial" font-size="12" fill="#374151">A stale-heartbeat sweep treats a crashed worker's RUNNING job as a failed attempt, feeding it back into the same retry/DLQ path shown above.</text>
</svg>